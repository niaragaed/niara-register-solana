[package]
name = "niara-register-solana"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "niara_register_solana"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.2.1"
mpl-bubblegum = "4.0.0"
# Commit-reveal hash and ORB attestation check (not re-exported by anchor-lang 1.x).
solana-sha256-hasher = "3"
solana-instructions-sysvar = "3"
solana-sdk-ids = "3"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
